name: DNS check
on:
  push:
    branches: [claude/dns-check]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          out=""
          for h in afnanfaeqasa.sa ftp.afnanfaeqasa.sa; do out="$out | $h A(local)=$(dig +short A $h | tr '\n' ' ') A(8.8.8.8)=$(dig +short A $h @8.8.8.8 | tr '\n' ' ')"; done
          out="$out | NS(8.8.8.8)=$(dig +short NS afnanfaeqasa.sa @8.8.8.8 | tr '\n' ' ')"
          P=$(dig +short NS sa. | head -1)
          out="$out | delegation=$(dig NS afnanfaeqasa.sa @$P +norec | grep -E 'IN\s+NS' | awk '{print $5}' | tr '\n' ' ')"
          for n in ns1.rmoztec.com ns2.rmoztec.com; do out="$out | $n=$(dig +short A $n @8.8.8.8 | tr '\n' ' ') ans=$(dig +short A ftp.afnanfaeqasa.sa @$n +time=3 +tries=1 2>&1 | tr '\n' ' ')"; done
          echo "::notice title=dns::$out"
