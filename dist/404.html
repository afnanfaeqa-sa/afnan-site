<script>
/* old links (Google Ads, old site) -> the right page; anything else -> home */
(function(){
  var p = location.pathname.replace(/\/+$/, "").toLowerCase();
  var map = { "/services": "/services.html", "/contact": "/#book", "/profile": "/profile/" };
  location.replace(map[p] || "/");
})();
</script>
